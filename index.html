<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drago Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="./img/logo2.png" type="image/png">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.80/build/spline-viewer.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    #vanta-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    /* Navbar */
    .navbar {
      background-color: rgba(0, 0, 0, 0.2) !important;
      padding: 0.8rem 1.5rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-bottom: 1px solid rgba(0, 255, 255, 0.2);
    }

    .navbar-brand {
      color: #ffffff !important;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .navbar-brand img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }

    .nav-link {
      color: #ffffff !important;
      font-weight: 500;
      padding: 0.5rem 1.2rem;
      margin: 0 0.5rem;
      transition: all 0.3s ease;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .nav-link:hover {
      color: #1DB954 !important;
      transform: translateY(-1px);
    }

    .nav-link.active {
      color: #1DB954 !important;
      font-weight: bold;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.5);
      padding: 0.5rem;
    }

    .navbar-toggler:focus {
      box-shadow: none;
      border-color: rgba(255, 255, 255, 0.75);
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 0.75)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    @media (max-width: 991.98px) {
      .navbar-collapse {
        background-color: rgba(0, 0, 0, 0.9);
        padding: 1rem;
        margin-top: 0.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .nav-link {
        padding: 0.75rem 1rem;
        margin: 0.25rem 0;
      }
    }

    main {
      padding-top: 80px;
      min-height: calc(100vh - 80px);
      position: relative;
      z-index: 1;
    }

    .welcome-section {
      text-align: center;
      padding: 100px 20px;
      position: relative;
      z-index: 2;
    }

    .welcome-title {
      font-size: 3.5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .welcome-subtitle {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cta-button {
      display: inline-block;
      padding: 12px 30px;
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      border: 2px solid #00ffff;
      background: transparent;
    }

    .cta-button:hover {
      background: #00ffff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
      .welcome-title {
        font-size: 2.5rem;
      }

      .welcome-subtitle {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 576px) {
      .welcome-title {
        font-size: 2rem;
      }

      .welcome-subtitle {
        font-size: 1.5rem;
      }

      .cta-button {
        padding: 10px 25px;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div id="vanta-canvas"></div>
  <div class="content-wrapper">
    <!-- Background 3D
    <spline-viewer url="https://prod.spline.design/56NDxjovT7fbYIwz/scene.splinecode"
      style="position: fixed; width: 100%; height: 100%; z-index: -1;"></spline-viewer> -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="img/logo.png" alt="Drago Logo">
          Drago
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-label="Toggle navigation menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="project.html">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Content</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <section class="welcome-section">
        <h1 class="welcome-title">Welcome to Our Website</h1>
        <!-- <p class="welcome-subtitle">Your Digital Experience Awaits</p> -->
        <a href="project.html" class="cta-button" style="margin-top: 50px;">Explore Projects</a>
      </section>
    </main>
  </div>

  <!-- <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/build/three.r134.min.js"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>

  <script>
    window.addEventListener('load', function() {
      VANTA.NET({
        el: "#vanta-canvas",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x00ffff,
        backgroundColor: 0x0,
        points: 10.00,
        maxDistance: 20.00,
        spacing: 15.00
      });
    });
  </script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
